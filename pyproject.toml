[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lookahead-schedule-generator"
version = "0.1.0"
description = "Three-week lookahead report from a schedule CSV"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
lookahead-schedule-generator = "lookahead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
